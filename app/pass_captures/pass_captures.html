<!doctype html><html><head><meta charset="utf-8"><title>URS Dynamic pass captures</title>
<style>
body{font:14px system-ui;margin:20px auto;max-width:1600px;padding:0 16px;background:#161b22;color:#e6edf3}
h1{font-size:22px}button{padding:9px 14px;cursor:pointer;margin:4px;background:#273447;color:#fff;border:1px solid #56677b;border-radius:5px}
.pass{border:1px solid #394554;padding:16px;margin:16px 0;border-radius:8px}
.segment{border:1px solid #364556;margin:12px 0;padding:8px;background:#0e131b}
.segment img{width:auto;max-width:100%;height:auto;display:block;margin:8px auto}
.segment p{margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1117;padding:12px}
a{color:#9acbff} .error{color:#ffb3b3}.meta{color:#b0c7dd}
</style></head><body>
<h1>URS — Scrolling Dynamic-pass diagnostics</h1>
<p>Each pass shows successive captured scroll positions, <strong>not just the last viewport</strong>. For long pages, up to 12 positions per pass are sampled. Diagnostic images are independent of the saved successful snapshot.</p>
<p><button id="refresh">Refresh captures</button><button id="html-export">Save complete visual report (.html)</button><button id="export">Export metadata JSON</button></p>
<div id="results">Loading…</div><script src="pass_captures.js"></script></body></html>
